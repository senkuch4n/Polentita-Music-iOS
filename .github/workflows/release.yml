name: Release IPA

# Builds an UNSIGNED .ipa and publishes it as a GitHub Release asset.
# Sideloadly / AltStore re-sign the app with the user's Apple ID on install,
# so the CI build does no code signing.
#
# Trigger it either way:
#   - push a tag matching v*        (e.g. git tag v1.0.1 && git push --tags)
#   - run the workflow manually and type a version (Actions tab -> Run workflow)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The project is developed against a very recent Xcode. If the build fails
      # to open the project on the runner, pin a concrete version here, e.g.
      #   xcode-version: "16.2"
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: npx pod-install

      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          NOTES='**IPA sin firmar** para instalar por sideload con Sideloadly o AltStore, que la firman con tu Apple ID al instalarla.

          - Guía de instalación: https://senkuch4n.github.io/Polentita-Music-iOS/
          - Requiere iOS 16.4 o superior.
          - Con un Apple ID gratuito la firma dura 7 días.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/ipa/PolentitaMusic.ipa --clobber
          else
            gh release create "$TAG" build/ipa/PolentitaMusic.ipa --title "PolentitaMusic $TAG" --notes "$NOTES"
          fi
